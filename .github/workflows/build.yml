name: Build Binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AI-Bridge.exe
            artifact_label: AI-Bridge-Windows
          - os: ubuntu-latest
            artifact_name: AI-Bridge
            artifact_label: AI-Bridge-Linux
          - os: macos-latest
            artifact_name: AI-Bridge
            artifact_label: AI-Bridge-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build binary
        run: python -m PyInstaller build.spec --noconfirm

      - name: Rename binary for release
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/AI-Bridge.exe dist/AI-Bridge-Windows.exe
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp dist/AI-Bridge dist/AI-Bridge-Linux
          else
            cp dist/AI-Bridge dist/AI-Bridge-macOS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_label }}
          path: dist/${{ matrix.artifact_label }}*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Bridge-Windows
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Bridge-Linux
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Bridge-macOS
          path: dist

      - name: Make Linux and macOS binaries executable
        run: |
          chmod +x dist/AI-Bridge-Linux || true
          chmod +x dist/AI-Bridge-macOS || true

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AI Bridge — Latest Build"
          body: |
            Binário mais recente compilado automaticamente a partir do branch `main`.

            | Plataforma | Download |
            |---|---|
            | Windows | [AI-Bridge-Windows.exe](https://github.com/${{ github.repository }}/releases/latest/download/AI-Bridge-Windows.exe) |
            | Linux | [AI-Bridge-Linux](https://github.com/${{ github.repository }}/releases/latest/download/AI-Bridge-Linux) |
            | macOS | [AI-Bridge-macOS](https://github.com/${{ github.repository }}/releases/latest/download/AI-Bridge-macOS) |

            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            dist/AI-Bridge-Windows.exe
            dist/AI-Bridge-Linux
            dist/AI-Bridge-macOS
