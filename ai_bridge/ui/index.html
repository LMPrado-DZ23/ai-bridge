<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              base: '#0a0c14',
              raised: '#0f1220',
              overlay: '#141826',
              border: 'rgba(255,255,255,0.07)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="bg-[#0a0c14] text-slate-100 antialiased select-none overflow-hidden h-screen flex flex-col">

  <!-- Ambient glow -->
  <div class="ab-glow" aria-hidden="true"></div>

  <!-- Title bar / drag region -->
  <header class="ab-bar pywebview-drag-region flex items-center justify-between px-4 h-10 flex-shrink-0 z-10 relative">
    <div class="flex items-center gap-2">
      <img src="assets/brands/ia-bridge.jpg" alt="AI Bridge" class="w-5 h-5 object-contain rounded flex-shrink-0" />
      <span class="text-[11px] font-semibold tracking-wide text-white/70">AI Bridge</span>
    </div>
    <div class="flex items-center gap-1">
      <button id="btn-minimize" class="ab-icon-btn" title="Minimizar" aria-label="Minimizar janela">
        <svg width="10" height="1" viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg>
      </button>
      <button id="btn-close" class="ab-icon-btn ab-icon-btn--close" title="Fechar" aria-label="Fechar janela">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Toast container -->
  <div id="ab-toasts" class="fixed bottom-4 left-0 right-0 flex flex-col items-center gap-2 pointer-events-none z-50" aria-live="polite" aria-atomic="true"></div>

  <!-- Main stage -->
  <main class="ab-stage flex-1 overflow-y-auto z-10 relative">

    <!-- ── Screen: Home ────────────────────────────────────────── -->
    <section data-screen="home" class="ab-screen flex flex-col h-full">

      <!-- Header -->
      <div class="px-5 pt-5 pb-3 flex-shrink-0">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-[10px] font-semibold tracking-widest text-indigo-400/70 uppercase mb-1">Proxy local · OpenAI compatible</p>
            <h1 class="text-base font-bold text-white leading-tight">Destinos</h1>
            <p class="text-[11px] text-white/40 mt-0.5">Escolha onde usar o AI Bridge</p>
          </div>
          <button id="btn-providers"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-semibold
                   bg-white/5 border border-white/10 text-white/70 hover:bg-white/10 hover:text-white
                   transition-all duration-150 flex-shrink-0 mt-0.5"
            aria-label="Gerenciar provedores">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 4h12v1.5H2V4zm0 3.5h12V9H2V7.5zm0 3.5h12v1.5H2V11z"/>
            </svg>
            Provedores
            <span id="home-provider-count"
              class="ml-0.5 min-w-[18px] h-[18px] rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] font-bold flex items-center justify-center px-1">
              0
            </span>
          </button>
        </div>
      </div>

      <!-- Target cards -->
      <div id="target-cards"
        class="flex-1 px-4 pb-4 grid gap-3"
        style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr))">
        <!-- Generated by renderHome() in app.js -->
      </div>

    </section>

    <!-- ── Screen: Target detail ───────────────────────────────── -->
    <section data-screen="target" class="ab-screen flex flex-col h-full" hidden>

      <!-- Header -->
      <div class="px-5 pt-4 pb-3 flex-shrink-0 flex items-center gap-3 border-b border-white/5">
        <button id="btn-back-target"
          class="ab-icon-btn -ml-1"
          aria-label="Voltar para destinos">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="10,3 5,8 10,13"/>
          </svg>
        </button>
        <div class="flex-1 min-w-0">
          <h2 id="target-title" class="text-sm font-bold text-white truncate">Destino</h2>
          <p id="target-desc" class="text-[11px] text-white/40 mt-0.5 leading-tight"></p>
        </div>
      </div>

      <!-- Connection diagram -->
      <div class="px-5 py-5 flex items-center gap-0 justify-center flex-shrink-0">

        <!-- Client node -->
        <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
          <div id="target-icon-left" class="ab-conn-node">
            <!-- icon injected by JS -->
          </div>
          <span class="ab-conn-label">Cliente</span>
        </div>

        <!-- Connection line -->
        <div id="target-conn-line" class="ab-conn-bridge flex-1 mx-3">
          <div class="ab-conn-line-track">
            <div class="ab-conn-line-fill"></div>
          </div>
        </div>

        <!-- AI Bridge node -->
        <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
          <div id="target-icon-right" class="ab-conn-node">
            <img src="assets/brands/ia-bridge.jpg" alt="AI Bridge" class="w-8 h-8 object-contain rounded-lg" />
          </div>
          <span class="ab-conn-label">AI Bridge</span>
        </div>

      </div>

      <!-- Connection status -->
      <div class="px-5 pb-3 flex-shrink-0">
        <div id="target-conn-status" class="ab-conn-status text-center">
          <!-- status text injected by JS -->
        </div>
      </div>

      <!-- Segmented control: AI Bridge / Provedor original -->
      <div class="px-5 pb-4 flex-shrink-0">
        <div class="ab-segmented" role="group" aria-label="Modo de roteamento">
          <button id="pill-bridge" class="ab-seg-btn" aria-pressed="false">
            <svg class="w-3.5 h-3.5 mr-1.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/>
            </svg>
            AI Bridge
          </button>
          <button id="pill-original" class="ab-seg-btn" aria-pressed="false">
            <svg class="w-3.5 h-3.5 mr-1.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M3 8h10M3 4h10M3 12h7"/>
            </svg>
            Provedor padrão
          </button>
        </div>
      </div>

      <!-- No-provider callout -->
      <div id="target-no-provider" class="px-5 flex-shrink-0" hidden>
        <div class="ab-callout ab-callout--warn">
          <svg class="w-4 h-4 flex-shrink-0 mt-0.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2L14 13H2L8 2z"/><line x1="8" y1="6.5" x2="8" y2="9"/><circle cx="8" cy="11" r="0.5" fill="currentColor" stroke="none"/>
          </svg>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-semibold text-amber-300 leading-tight">Nenhum provedor configurado</p>
            <p class="text-[11px] text-amber-200/60 mt-0.5 leading-snug">Adicione um provedor para usar o AI Bridge neste destino.</p>
            <button id="btn-go-providers-from-target"
              class="mt-2 text-[11px] font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">
              Ir para Provedores →
            </button>
          </div>
        </div>
      </div>

      <!-- Spacer -->
      <div class="flex-1"></div>

    </section>

    <!-- ── Screen: Providers ───────────────────────────────────── -->
    <section data-screen="providers" class="ab-screen flex flex-col h-full" hidden>

      <!-- Header -->
      <div class="px-5 pt-4 pb-3 flex-shrink-0 flex items-center gap-3 border-b border-white/5">
        <button id="btn-back-providers"
          class="ab-icon-btn -ml-1"
          aria-label="Voltar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="10,3 5,8 10,13"/>
          </svg>
        </button>
        <h2 class="flex-1 text-sm font-bold text-white">Provedores</h2>
        <button id="btn-add-from-providers"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-semibold
                 bg-indigo-500 text-white hover:bg-indigo-400 active:bg-indigo-600
                 transition-all duration-150"
          aria-label="Adicionar provedor">
          <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
          </svg>
          Adicionar
        </button>
      </div>

      <!-- Provider list -->
      <div id="provider-list-screen" class="flex-1 px-4 py-3 flex flex-col gap-2 overflow-y-auto">
        <!-- Generated by renderProviders() in app.js -->
      </div>

    </section>

    <!-- ── Screen: Add / Edit provider ────────────────────────── -->
    <section data-screen="add" class="ab-screen flex flex-col h-full" hidden>

      <!-- Header -->
      <div class="px-5 pt-4 pb-3 flex-shrink-0 flex items-center gap-3 border-b border-white/5">
        <button id="btn-back-add"
          class="ab-icon-btn -ml-1"
          aria-label="Cancelar e voltar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="10,3 5,8 10,13"/>
          </svg>
        </button>
        <h2 id="add-screen-title" class="flex-1 text-sm font-bold text-white">Adicionar provedor</h2>
      </div>

      <!-- Preset pills -->
      <div class="px-5 pt-3 pb-2 flex-shrink-0">
        <p class="text-[10px] font-semibold tracking-widest text-white/30 uppercase mb-2">Presets rápidos</p>
        <div id="preset-list" class="flex flex-wrap gap-1.5">
          <!-- Generated by JS -->
        </div>
      </div>

      <!-- Form -->
      <form id="add-form" class="flex-1 overflow-y-auto px-5 py-3 flex flex-col gap-3" novalidate autocomplete="off">

        <div>
          <label for="f-name" class="ab-label">Nome</label>
          <input id="f-name" name="name" type="text"
            class="ab-input" placeholder="ex: DeepSeek pessoal"
            autocomplete="off" spellcheck="false" />
        </div>

        <div>
          <label for="f-url" class="ab-label">Endpoint base</label>
          <input id="f-url" name="url" type="url"
            class="ab-input" placeholder="https://api.example.com/v1"
            autocomplete="off" spellcheck="false" />
        </div>

        <div>
          <label class="ab-label">
            API Key
            <span id="save-label" class="ab-label-hint hidden">(chave salva — deixe em branco para manter)</span>
          </label>
          <div class="ab-input-group">
            <input id="f-key" name="key" type="password"
              class="ab-input ab-input--group" placeholder="sk-..."
              autocomplete="new-password" spellcheck="false" />
            <button id="btn-show-key" type="button"
              class="ab-input-suffix"
              aria-label="Mostrar/ocultar chave">
              <svg id="icon-eye" class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
                <circle cx="8" cy="8" r="2"/>
              </svg>
              <svg id="icon-eye-off" class="w-4 h-4 hidden" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M2 2l12 12M6.5 6.5A2 2 0 0 0 9.5 9.5M3 3.7C1.7 5 1 7 1 8s2.5 5 7 5c1.2 0 2.3-.3 3.3-.7"/>
                <path d="M8 3c4.5 0 7 5 7 5s-.6 1.3-1.7 2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="f-models" class="ab-label">
            Modelos
            <span class="ab-label-hint">um por linha · formato: nome, provider/id, ou Label · Provider</span>
          </label>
          <textarea id="f-models" name="models" rows="4"
            class="ab-textarea" placeholder="deepseek-chat&#10;deepseek-reasoner"
            spellcheck="false"></textarea>
        </div>

        <!-- Test connection -->
        <div class="flex items-center gap-3">
          <button id="btn-test" type="button"
            class="btn btn-ghost btn-sm"
            aria-label="Testar conexão com o provedor">
            <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <polyline points="1,8 6,3 11,8"/><line x1="6" y1="3" x2="6" y2="13"/>
              <polyline points="9,10 14,10"/><polyline points="11,8 14,10 11,12"/>
            </svg>
            Testar conexão
          </button>
          <span id="test-result" class="text-[11px]"></span>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 pt-1 pb-2">
          <button id="btn-save" type="submit"
            class="btn btn-primary flex-1">
            Salvar
          </button>
          <button id="btn-cancel" type="button"
            class="btn btn-ghost">
            Cancelar
          </button>
        </div>

      </form>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
