<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Bridge</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Title bar -->
<header class="ab-bar pywebview-drag-region">
  <div class="ab-brand pywebview-drag-region">
    <img src="icons/bridge.svg" width="16" height="16" alt="">
    <span>AI Bridge</span>
  </div>
  <div class="ab-win">
    <button class="ab-win-btn" id="btn-minimize" aria-label="Minimizar">
      <svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg>
    </button>
    <button class="ab-win-btn ab-win-btn--close" id="btn-close" aria-label="Minimizar para a bandeja">
      <svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>
    </button>
  </div>
</header>

<main class="ab-stage">

  <!-- ── Screen: Home (target selector) ────────────────────────────────────── -->
  <section class="ab-screen" data-screen="home">
    <div class="ab-home-header">
      <h1 class="ab-home-title">Onde você quer usar<br>o AI Bridge?</h1>
      <button class="ab-providers-btn" id="btn-providers">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="7" r="5.5"/>
          <path d="M7 4v3l2 1.5"/>
        </svg>
        Provedores
        <span class="ab-provider-badge" id="home-provider-count"></span>
      </button>
    </div>
    <div class="ab-target-cards" id="target-cards">
      <!-- populated by JS -->
    </div>
  </section>

  <!-- ── Screen: Target detail ────────────────────────────────────────────── -->
  <section class="ab-screen" data-screen="target" hidden>
    <div class="ab-screen-nav">
      <button class="ab-back" id="btn-back-target">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
        Voltar
      </button>
    </div>

    <div class="ab-conn-area">
      <div class="ab-conn-diagram">
        <div class="ab-conn-node" id="target-icon-wrap">
          <div class="ab-conn-icon" id="target-icon-left"></div>
          <div class="ab-conn-label" id="target-title"></div>
        </div>

        <div class="ab-conn-bridge" id="target-conn-line">
          <div class="ab-conn-line-track">
            <div class="ab-conn-line-fill"></div>
          </div>
        </div>

        <div class="ab-conn-node">
          <div class="ab-conn-icon" id="target-icon-right"></div>
          <div class="ab-conn-label">AI Bridge</div>
        </div>
      </div>

      <div class="ab-conn-status" id="target-conn-status"></div>
    </div>

    <div class="ab-target-desc" id="target-desc"></div>

    <div class="ab-pill-toggle" id="pill-toggle">
      <button class="ab-pill-btn" id="pill-bridge" data-action="connect">AI Bridge</button>
      <button class="ab-pill-btn" id="pill-original" data-action="disconnect">Provedor Original</button>
    </div>

    <div class="ab-no-provider" id="target-no-provider" hidden>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5.5"/><path d="M7 4.5v3M7 9.5v.5"/></svg>
      Nenhum provedor configurado.
      <button class="ab-link" id="btn-go-providers-from-target">Adicionar provedor</button>
    </div>
  </section>

  <!-- ── Screen: Providers list ────────────────────────────────────────────── -->
  <section class="ab-screen" data-screen="providers" hidden>
    <div class="ab-screen-nav">
      <button class="ab-back" id="btn-back-providers">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
        Voltar
      </button>
      <button class="btn btn-primary btn-sm" id="btn-add-from-providers">+ Adicionar</button>
    </div>

    <div class="ab-screen-title">Provedores</div>
    <div class="ab-screen-sub">APIs compatíveis com OpenAI</div>

    <div id="provider-list-screen">
      <!-- populated by JS -->
    </div>
  </section>

  <!-- ── Screen: Add / Edit Provider ────────────────────────────────────────── -->
  <section class="ab-screen" data-screen="add" hidden>
    <div class="ab-screen-nav">
      <button class="ab-back" id="btn-back-add">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
        Voltar
      </button>
    </div>

    <div>
      <div class="ab-screen-title" id="add-screen-title">Novo Provedor</div>
      <div class="ab-screen-sub">Qualquer API compatível com OpenAI funciona.</div>
    </div>

    <!-- Presets -->
    <div>
      <div class="ab-section-head" style="margin-bottom:6px;">
        <span class="ab-section-title">Início rápido</span>
      </div>
      <div class="ab-preset-list" id="preset-list">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="ab-divider"></div>

    <!-- Form -->
    <form class="ab-form" id="add-form" autocomplete="off">

      <div class="ab-field">
        <label class="ab-label" for="f-name">Nome do provedor</label>
        <input class="ab-input" id="f-name" type="text" placeholder="Ex: DeepSeek, OpenAI, Groq…" required>
      </div>

      <div class="ab-field">
        <label class="ab-label" for="f-url">URL base da API</label>
        <input class="ab-input" id="f-url" type="url" placeholder="https://api.deepseek.com/v1" required>
      </div>

      <div class="ab-field">
        <label class="ab-label" for="f-key">Chave de API</label>
        <div class="ab-row">
          <input class="ab-input" id="f-key" type="password" placeholder="sk-…" required autocomplete="new-password">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-show-key">Mostrar</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-test">Testar</button>
        </div>
        <div id="test-result" hidden></div>
      </div>

      <div class="ab-field">
        <label class="ab-label" for="f-models">Modelos</label>
        <textarea class="ab-textarea" id="f-models" rows="4"
          placeholder="deepseek-chat|DeepSeek Chat&#10;deepseek-reasoner|DeepSeek Reasoner&#10;&#10;Formato: id|Nome visível  (ou apenas  id)"></textarea>
        <div class="ab-hint">
          Um modelo por linha. Use <code>id|Nome</code> para personalizar o nome.
        </div>
      </div>

      <div class="ab-row" style="justify-content:flex-end;gap:8px;">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-save">
          <span id="save-label">Salvar Provedor</span>
        </button>
      </div>

    </form>
  </section>

</main>

<!-- Toast container -->
<div id="ab-toasts"></div>

<script src="app.js"></script>
</body>
</html>
