<svg width="520" height="640" viewBox="0 0 520 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="260" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090b18"/>
      <stop offset="60%" stop-color="#0d1128"/>
      <stop offset="100%" stop-color="#0a0e1e"/>
    </linearGradient>
    <linearGradient id="grad-active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="520" height="640" rx="12" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect width="520" height="44" rx="12" fill="rgba(255,255,255,0.03)"/>
  <rect y="12" width="520" height="32" fill="rgba(255,255,255,0.03)"/>
  <!-- Brand -->
  <circle cx="24" cy="22" r="8" fill="#06b6d4" opacity="0.9"/>
  <text x="36" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">AI Bridge</text>
  <!-- Win buttons -->
  <circle cx="488" cy="22" r="7" fill="rgba(248,113,113,0.25)" stroke="rgba(248,113,113,0.4)" stroke-width="1"/>
  <line x1="485" y1="19" x2="491" y2="25" stroke="#f87171" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="491" y1="19" x2="485" y2="25" stroke="#f87171" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="468" cy="22" r="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="463" y1="22" x2="473" y2="22" stroke="#8892a4" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="0" y1="44" x2="520" y2="44" stroke="rgba(255,255,255,0.07)"/>

  <!-- Home header -->
  <text x="28" y="90" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Onde você quer usar</text>
  <text x="28" y="112" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">o AI Bridge?</text>

  <!-- Providers button -->
  <rect x="336" y="75" width="156" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="364" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#8892a4">Provedores</text>
  <rect x="430" y="81" width="18" height="18" rx="9" fill="rgba(99,102,241,0.8)"/>
  <text x="434" y="94" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>

  <!-- Target card 1: Claude Code -->
  <rect x="16" y="130" width="488" height="82" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- icon -->
  <circle cx="58" cy="171" r="22" fill="#1a1a2e"/>
  <circle cx="58" cy="149" r="3.5" fill="#e07b39"/>
  <circle cx="68" cy="155" r="3.5" fill="#e07b39"/>
  <circle cx="68" cy="167" r="3.5" fill="#e07b39"/>
  <circle cx="58" cy="173" r="3.5" fill="#e07b39"/>
  <circle cx="48" cy="167" r="3.5" fill="#e07b39"/>
  <circle cx="48" cy="155" r="3.5" fill="#e07b39"/>
  <!-- text -->
  <text x="94" y="164" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Claude Code</text>
  <text x="94" y="183" font-family="system-ui,sans-serif" font-size="12" fill="#8892a4">Terminal e IDEs</text>
  <!-- status -->
  <circle cx="447" cy="171" r="5" fill="#10b981"/>
  <circle cx="447" cy="171" r="5" fill="#10b981" opacity="0.4">
    <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="457" y="175" font-family="system-ui,sans-serif" font-size="11" fill="#10b981">Conectado</text>
  <polyline points="498,167 504,171 498,175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target card 2: Claude Desktop -->
  <rect x="16" y="224" width="488" height="82" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="58" cy="265" r="22" fill="#1a1a2e"/>
  <circle cx="58" cy="243" r="3.5" fill="#e07b39"/>
  <circle cx="68" cy="249" r="3.5" fill="#e07b39"/>
  <circle cx="68" cy="261" r="3.5" fill="#e07b39"/>
  <circle cx="58" cy="267" r="3.5" fill="#e07b39"/>
  <circle cx="48" cy="261" r="3.5" fill="#e07b39"/>
  <circle cx="48" cy="249" r="3.5" fill="#e07b39"/>
  <text x="94" y="258" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Claude Desktop</text>
  <text x="94" y="277" font-family="system-ui,sans-serif" font-size="12" fill="#8892a4">Aplicativo desktop</text>
  <circle cx="447" cy="265" r="5" fill="#3b82f6"/>
  <text x="457" y="269" font-family="system-ui,sans-serif" font-size="11" fill="#3b82f6">Instalado</text>
  <polyline points="498,261 504,265 498,269" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target card 3: Codex -->
  <rect x="16" y="318" width="488" height="82" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="58" cy="359" r="22" fill="#1a1a2e"/>
  <path d="M70 349 A14 14 0 1 0 70 369" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="46" y1="359" x2="62" y2="359" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="352" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Codex</text>
  <text x="94" y="371" font-family="system-ui,sans-serif" font-size="12" fill="#8892a4">App e terminal OpenAI</text>
  <circle cx="447" cy="359" r="5" fill="#3b4060"/>
  <text x="457" y="363" font-family="system-ui,sans-serif" font-size="11" fill="#3a4560">Não instalado</text>
  <polyline points="498,355 504,359 498,363" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
