<svg viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg" width="520" height="640">
  <!-- Window shell -->
  <rect width="520" height="640" rx="12" fill="#0a0c14"/>
  <rect width="520" height="640" rx="12" fill="none" stroke="#1e2235" stroke-width="1"/>

  <!-- ── Title bar ── -->
  <rect width="520" height="48" rx="12" fill="#0c0e1b"/>
  <rect y="24" width="520" height="24" fill="#0c0e1b"/>

  <!-- AI Bridge brand asset -->
  <image href="../ai_bridge/ui/assets/brands/ia-bridge.jpg" x="214" y="7" width="24" height="24" preserveAspectRatio="xMidYMid meet"/>

  <!-- App name -->
  <text x="242" y="29" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">AI Bridge</text>

  <!-- Window buttons -->
  <rect x="450" y="14" width="22" height="20" rx="5" fill="#1a1f35"/>
  <line x1="456" y1="24" x2="466" y2="24" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="480" y="14" width="22" height="20" rx="5" fill="#1a1f35"/>
  <line x1="486" y1="19" x2="496" y2="29" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="496" y1="19" x2="486" y2="29" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── Navigation ── -->
  <rect y="48" width="520" height="40" fill="#0a0c14"/>
  <text x="28" y="73" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#475569">Início</text>
  <text x="100" y="73" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Provedores</text>
  <rect x="96" y="85" width="74" height="2" rx="1" fill="#6366f1"/>
  <line x1="0" y1="87" x2="520" y2="87" stroke="#1e2235" stroke-width="1"/>

  <!-- ── Section heading ── -->
  <text x="28" y="120" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Adicionar Provedor</text>

  <!-- ── Add form card ── -->
  <rect x="20" y="136" width="480" height="390" rx="10" fill="#0f1220" stroke="#1e2235" stroke-width="1"/>

  <!-- Presets row -->
  <text x="40" y="162" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#64748b">PREDEFINIÇÕES</text>
  <rect x="40" y="170" width="68" height="24" rx="5" fill="#161a2e" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
  <text x="74" y="182" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#a5b4fc">OpenAI</text>
  <rect x="116" y="170" width="68" height="24" rx="5" fill="#161a2e"/>
  <text x="150" y="182" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">Groq</text>
  <rect x="192" y="170" width="68" height="24" rx="5" fill="#161a2e"/>
  <text x="226" y="182" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">Gemini</text>
  <rect x="268" y="170" width="68" height="24" rx="5" fill="#161a2e"/>
  <text x="302" y="182" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">Mistral</text>
  <rect x="344" y="170" width="68" height="24" rx="5" fill="#161a2e"/>
  <text x="378" y="182" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#64748b">Ollama</text>

  <!-- Divider -->
  <line x1="40" y1="206" x2="480" y2="206" stroke="#1e2235" stroke-width="1"/>

  <!-- Name field -->
  <text x="40" y="228" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Nome do Provedor</text>
  <rect x="40" y="236" width="440" height="34" rx="6" fill="#0a0c14" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="253" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#f1f5f9">OpenAI</text>

  <!-- Base URL field -->
  <text x="40" y="288" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8">URL Base</text>
  <rect x="40" y="296" width="440" height="34" rx="6" fill="#0a0c14" stroke="#1e2235" stroke-width="1"/>
  <text x="56" y="313" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#64748b">https://api.openai.com/v1</text>

  <!-- API Key field -->
  <text x="40" y="348" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Chave de API</text>
  <rect x="40" y="356" width="440" height="34" rx="6" fill="#0a0c14" stroke="#1e2235" stroke-width="1"/>
  <text x="56" y="373" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#334155">••••••••••••••••</text>
  <!-- Lock icon hint -->
  <text x="462" y="373" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#475569">🔒</text>

  <!-- Models textarea -->
  <text x="40" y="408" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Modelos (id|nome)</text>
  <rect x="40" y="416" width="440" height="72" rx="6" fill="#0a0c14" stroke="#1e2235" stroke-width="1"/>
  <text x="56" y="434" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748b">gpt-4o|GPT-4o</text>
  <text x="56" y="450" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748b">gpt-4o-mini|GPT-4o Mini</text>
  <text x="56" y="466" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#475569">o1|o1</text>

  <!-- Security note -->
  <rect x="40" y="498" width="440" height="20" rx="4" fill="#161a2e"/>
  <text x="50" y="508" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#475569">🔐 Chave armazenada com segurança no sistema keyring — nunca em disco</text>

  <!-- Action buttons -->
  <rect x="40" y="480" width="200" height="34" rx="7" fill="none" stroke="#1e2235" stroke-width="1"/>
  <text x="140" y="497" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#64748b">Testar Conexão</text>
  <rect x="280" y="480" width="200" height="34" rx="7" fill="#6366f1"/>
  <text x="380" y="497" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500" fill="white">Salvar Provedor</text>

  <!-- ── Footer ── -->
  <line x1="0" y1="604" x2="520" y2="604" stroke="#1e2235" stroke-width="1"/>
  <text x="28" y="624" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#334155">AI Bridge v1.0.0</text>
  <circle cx="456" cy="621" r="3" fill="#22c55e"/>
  <text x="464" y="625" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#334155">Proxy ativo</text>
</svg>
