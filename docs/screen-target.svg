  <circle cx="172" cy="214" r="4" fill="#06b6d4"/>
  <circle cx="368" cy="214" r="4" fill="#6366f1"/>

  <!-- Right icon: Invision -->
  <rect x="368" y="178" width="72" height="72" rx="12" fill="url(#icon-bg1)" stroke="rgba(99,102,241,0.35)" stroke-width="1.5"/>
  <!-- Diamond icon large -->
  <path d="M404 192L420 208L404 224L388 208Z" fill="none" stroke="#06b6d4" stroke-width="1.8"/>
  <path d="M404 196L416 208L404 220L392 208Z" fill="#06b6d4" opacity="0.2"/>
  <path d="M404 200L412 208L404 216L396 208Z" fill="#06b6d4" opacity="0.6"/>
  <text x="404" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Invision</text>

  <!-- ── Provider section ── -->
  <text x="28" y="304" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#475569" letter-spacing="2">PROVEDOR PADRÃO</text>

  <!-- Toggle pill background -->
  <rect x="28" y="316" width="350" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Active tab (Invision) -->
  <rect x="30" y="318" width="170" height="38" rx="19" fill="url(#toggle-active)"/>
  <text x="115" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Invision</text>

  <!-- Inactive tab (OpenAI) -->
  <text x="293" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">OpenAI (plano ChatGPT)</text>

  <!-- Switch warning -->
  <text x="28" y="378" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Trocar fecha e reabre o Codex automaticamente.</text>

  <!-- Provider info row -->
  <rect x="28" y="400" width="484" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Provider icon -->
  <rect x="40" y="415" width="30" height="30" rx="6" fill="url(#icon-bg1)"/>
  <path d="M55 423L60 428L55 433L50 428Z" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M55 425L58 428L55 431L52 428Z" fill="#06b6d4" opacity="0.6"/>
  <text x="82" y="428" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">DeepSeek</text>
  <circle cx="82" cy="440" r="3.5" fill="#06b6d4"/>
  <text x="92" y="444" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">deepseek-r1 · Conectado</text>

  <!-- ── Footer ── -->
  <line x1="28" y1="588" x2="512" y2="588" stroke="rgba(255,255,255,0.05)"/>

  <!-- Left footer links -->
  <text x="28" y="612" font-family="system-ui,sans-serif" font-size="11" fill="#475569">← Ferramentas</text>
  <text x="128" y="612" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Trocar código</text>
  <text x="228" y="612" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Atualizar lista</text>

  <!-- Concluir button -->
  <rect x="376" y="596" width="136" height="38" rx="19" fill="url(#btn-grad)"/>
  <text x="444" y="620" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Concluir</text>
</svg>
